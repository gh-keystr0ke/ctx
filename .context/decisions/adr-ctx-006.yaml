id: ADR-CTX-006
type: decision
status: active
title: Changed-symbol linking uses bounded file-level attribution.
decision: >
  Changed-symbol linking uses file-level attribution to every indexed symbol
  in the changed-path set and does not infer which entity changed within a
  file. Changesets wider than 10% of the indexed files, floored at 20 files,
  emit no changed-symbol links because broad sweeps are not useful evidence.
implementation:
  - symbol: ctx_core.linking.changed_symbol_links
tests:
  - symbol: ctx_core.linking.tests.changed_symbol_links_attribute_symbols_in_changed_files_only
