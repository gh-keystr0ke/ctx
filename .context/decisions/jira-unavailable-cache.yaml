id: ADR-EXT-008
type: decision
feature: FEAT-INDEXING
title: Make external ingestion incremental by complete identity with atomic batches and explicit refresh
status: accepted
decision: >
  External skip decisions use the complete artifact identity
  (provider, kind, external ID), never a bare provider-wide string. Routine
  Jira ingestion skips complete local Jira issues and GitLab
  business-linked ingestion skips complete local merge requests while still
  listing summaries needed for deterministic repository matching. GitLab
  all-scope remains cursor-based. Each network response's artifacts and
  deterministic links are persisted in one SQLite transaction after text
  links are computed against the old plus fetched artifact set, so a failed
  link write cannot expose a root that suppresses a complete retry.

  Jira candidate keys are valid across every project on the configured Cloud
  site; the backward-compatible `[jira].project` setting is informational,
  not an admissibility filter or artifact-project source. Search results are
  fully paginated, missing results are probed by issue key, and isolatable
  batch errors are bisected. Only confirmed per-key or comment 403/404
  responses become unavailable; authentication, unexpected HTTP, transport,
  parsing, and pagination failures remain fatal. Provider-returned
  `fields.project.key` supplies issue and comment project identity.

  Jira 403/404 results and successful-search omissions confirmed by a
  per-issue 403/404 are stable enough to skip during routine repository
  ingestion, but they are not permanent product facts. Store them in the
  repository-local SQLite `unavailable_external_keys` table, keyed by repository,
  provider, and external ID with the last successful check time. Normal Jira
  runs pass this negative cache to the connector separately from complete
  locally stored artifact identities, so cached keys are neither requested
  nor treated as available link targets. Newly observed unavailable keys are
  added only after the provider fetch and atomic artifact/link batch succeed.

  `ctx ingest jira --refresh` is the explicit revalidation boundary: it
  ignores both positive and negative local skip sets and atomically replaces
  the provider's negative-cache snapshot only after the complete refresh
  succeeds. Provider, transport, parsing, or persistence failure leaves the
  old cache intact. The same flag bypasses GitLab's all-scope cursor or
  business-linked identity skip set. Local-only `git` and `code-comments`
  ingestion reject `--refresh` before opening the database because the flag
  has no coherent provider state to revalidate there.

  This decision supersedes only ADR-EXT-005's historical clauses that every
  Jira run re-fetches all candidates and that configured-project membership
  filters accepted keys. ADR-EXT-005 remains accepted for its transport,
  bounded traversal, no-time-cursor, ADF, pagination, and Jira Cloud scope
  decisions; in particular, refresh does not introduce time-based Jira JQL.
