id: INV-DETERMINISM-001
type: invariant
feature: FEAT-INDEXING
status: active
statement: >
  The same repository state and configuration must produce deterministic stable
  identities and output, independent of the order changed files happen to be
  processed in, with at most one current edge version for each claim
  fingerprint, deterministic database-entity lifecycle, and no cross-language,
  cross-file, or same-shape identity conflation: two unrelated symbols must
  never be silently merged into one node just because they share a structural
  fingerprint. Best-effort ORM/migration schema reconciliation shares this
  determinism: it replays every migration touching an entity in file-path
  order, never processing order, so the same repository state always produces
  the same reconciliation result.
implementation:
  - symbol: ctx_core.indexing.normalize_plan
  - symbol: ctx_core.indexing.match_symbols
  - symbol: ctx_core.indexing.reserve_exact_canonical_matches
  - symbol: ctx_adapters.sqlite.index.persist_edge
  - symbol: ctx_core.schema.reconcile_orm_and_migrations
tests:
  - symbol: ctx_adapters.sqlite.tests.migration_closes_duplicate_current_edges_and_enforces_uniqueness
  - symbol: ctx_core.indexing.tests.identical_symbols_in_different_languages_keep_distinct_identities
  - symbol: ctx_adapters.rust.tests.workspace_rust_symbols_produce_unique_graph_identities
  - symbol: ctx_core.indexing.tests.differently_named_symbols_with_the_same_shape_do_not_merge_across_files
  - symbol: ctx_core.indexing.tests.same_named_same_shaped_symbols_in_different_files_claim_distinct_identities
  - symbol: ctx_core.indexing.tests.same_named_same_shaped_symbols_claim_distinct_identities_regardless_of_file_order
  - symbol: ctx_core.indexing.tests.database_entities_and_facts_follow_the_current_symbol_snapshot
  - symbol: ctx_core.schema.tests.reconciliation_replays_migrations_in_file_path_order
