name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: taiki-e/install-action@cargo-mutants
      - run: cargo mutants --workspace --no-shuffle --shard ${{ matrix.shard }}/4 --timeout 300
