[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is flagged unmaintained, with no safe upgrade. It is not a
    # vulnerability, and ctx uses it only for current-time RFC 3339 stamps,
    # one log-file timestamp, and one RFC 2822 Retry-After parse. Remove this
    # entry once chrono is replaced.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no fix; narrow use, replacement tracked separately" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
