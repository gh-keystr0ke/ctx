id: ADR-AGENT-001
type: decision
feature: FEAT-INDEXING
title: AI agents sit behind one interchangeable port trait
status: accepted
decision: >
  Every concrete AI agent — Claude Code CLI, OpenAI Codex CLI, Google
  Antigravity CLI (`agy`), any other CLI- or API-backed model later — is
  referenced only through ctx_app.ports.SemanticAgent outside its own
  adapter module (PR-P05, PR-AGENT-001). ctx-core and ctx-app never name a
  specific vendor or model: ctx_core.neighborhood builds the bounded input,
  ctx_core.knowledge defines the typed output shape, and
  ctx_app.enrich.EnrichRunner orchestrates selection and persistence purely
  against the trait. Confirmed adding a second and third agent really does
  cost only what this decision predicted: ctx_adapters.codex and
  ctx_adapters.antigravity are each under 100 lines, own only their process
  invocation (`codex exec <prompt>`, `agy -p <prompt>`), and the ctx-cli
  composition root (which must name an agent to select one, `--agent
  claude|codex|antigravity`) — zero changes to ctx-core, ctx-app, or the
  SemanticAgent trait itself. The prompt contract, JSON-response parsing,
  and evidence/path validation were never actually Claude-specific, so they
  live once in ctx_adapters.agent_contract (AgentTransport trait +
  analyze()) and every vendor module is a thin AgentTransport
  implementation plus a one-line SemanticAgent delegation, rather than each
  adapter reimplementing (and risking silently diverging on) the same
  validation rules. Independent second-opinion review (`ctx verify
  --knowledge --auto`, REQ-VERIFY-003) reuses this exact shape rather than
  inventing a second one: ctx_app.ports.KnowledgeReviewAgent is a deliberate
  sibling trait to SemanticAgent (a genuinely different question -- "should
  this already-extracted candidate be accepted" vs. "does this neighborhood
  state new knowledge" -- with a different input/output shape, not the same
  trait reused), and ctx_adapters.agent_contract.review() is a second
  prompt/parse function next to analyze() sharing only AgentTransport and
  the JSON-extraction helper. Each vendor's `XAgent<T>` implements both
  traits by delegating to its one already-owned `transport` field -- adding
  review cost each vendor module exactly one more trait impl, zero new
  process-invocation code, confirming the same "adding a capability costs
  only a thin delegation" property this ADR already established for a third
  vendor.

  `ctx verify --stale` (REQ-VERIFY-004) confirmed the same shape scales to a
  third question: ctx_app.ports.StaleClaimReviewAgent is a further sibling
  trait (re-examining an already-established claim against current code,
  neither "does this state new knowledge" nor "should this candidate be
  accepted"), and ctx_adapters.agent_contract.review_stale_claims is a third
  prompt/parse function next to analyze()/review() sharing the same
  AgentTransport and JSON-extraction helpers. Each vendor's `XAgent<T>` now
  implements three traits by delegating to the same one `transport` field --
  adding this third capability again cost every vendor module exactly one
  more trait impl and zero new process-invocation code.
implementation:
  - symbol: ctx_app.ports.SemanticAgent
  - symbol: ctx_app.ports.KnowledgeReviewAgent
  - symbol: ctx_app.ports.StaleClaimReviewAgent
  - symbol: ctx_adapters.agent_contract.AgentTransport
  - symbol: ctx_adapters.agent_contract.analyze
  - symbol: ctx_adapters.agent_contract.review
  - symbol: ctx_adapters.agent_contract.review_stale_claims
  - symbol: ctx_adapters.claude_code.ClaudeCodeAgent
  - symbol: ctx_adapters.codex.CodexAgent
  - symbol: ctx_adapters.antigravity.AntigravityAgent
tests:
  - symbol: ctx_adapters.claude_code.tests.subprocess_transport_invokes_claude_p_and_returns_stdout
  - symbol: ctx_adapters.codex.tests.subprocess_transport_invokes_codex_exec_and_returns_stdout
  - symbol: ctx_adapters.antigravity.tests.subprocess_transport_invokes_agy_p_and_returns_stdout
  - symbol: ctx_app.enrich.tests.analyzes_every_artifact_and_persists_only_relevant_candidates
  - symbol: crates.ctx-cli.tests.e2e.enrich_dispatches_codex_to_codex_exec_with_its_own_binary_override
  - symbol: crates.ctx-cli.tests.e2e.enrich_dispatches_antigravity_to_agy_p_with_its_own_binary_override
  - symbol: ctx_adapters.agent_contract.tests.review_can_reject_a_candidate_extraction_already_called_relevant
  - symbol: ctx_adapters.agent_contract.tests.review_stale_claims_can_reject_a_mapping_that_no_longer_holds
 

