id: ADR-FEDERATION-001
type: decision
visibility: public
status: accepted
title: Model HTTP contracts as their own deterministic fact family
decision: >-
  HTTP endpoints and outbound requests use language-neutral ApiEndpoint/ExternalCall IR and
  repository-scoped API/external nodes connected by EXPOSES and CALLS_EXTERNAL facts; they do not
  extend DbEntity and indexing never resolves an outbound URL against a neighboring repository.
  Pure literal URLs are accepted. An f-string or .format URL is accepted only when it has a literal
  http(s) authority and every interpolation replaces a complete path segment after that authority;
  the segment is normalized to {param}. Interpolation in the authority, query fragment, or only
  part of a segment, concatenation, and a whole URL variable remain unknown and emit no fact.
  A Python HTTP wrapper is recognized only one hop through self/cls in the same class, when an
  undecorated self method or exact bare classmethod led by cls contains only one direct HTTP call
  expression or return (apart from a docstring and one optional await) and forwards fixed or bare
  ordinary-parameter verb/URL inputs without transformation. Base, mixin, cross-class, imported,
  module-level, static, otherwise decorated, multi-statement, multi-call, positional-only,
  keyword-only, variadic, transformed-parameter, and dynamic call-site URL shapes remain unknown.
  Wrapper-derived request and response fields also remain unknown because verb/URL forwarding does
  not prove payload forwarding or response pass-through.
  OpenAPI operations use the same ApiEndpoint identity while retaining their operation metadata,
  security, content types, and response contracts instead of inventing a parallel ontology.
implementation:
  - symbol: ctx_core.ir.ApiEndpoint
  - symbol: ctx_core.ir.ExternalCall
  - symbol: ctx_core.indexing.add_http_facts
  - symbol: ctx_core.ir.OpenApiOperation
  - symbol: ctx_adapters.python.static_url_template
  - symbol: ctx_adapters.python.detect_http_wrappers
  - symbol: ctx_adapters.python.resolve_wrapper_spec
tests:
  - symbol: ctx_adapters.python.tests.extracts_static_requests_and_httpx_calls_and_normalizes_dynamic_path_segments
  - symbol: ctx_adapters.python.tests.wrapper_method_with_verb_from_parameter_resolves_when_call_site_passes_a_literal_verb
  - symbol: ctx_adapters.python.tests.wrapper_chain_deeper_than_one_hop_produces_no_fact_at_the_outer_caller
  - symbol: ctx_adapters.python.tests.wrapper_derived_fields_remain_unknown
  - symbol: ctx_core.indexing.tests.api_and_external_http_facts_follow_the_full_index_lifecycle
  - symbol: ctx_core.review.tests.openapi_security_and_response_changes_are_destructive
