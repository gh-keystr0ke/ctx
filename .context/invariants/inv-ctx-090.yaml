id: INV-CTX-090
type: invariant
status: active
statement: The GitLab ingest cursor advances only after artifacts and links are fully persisted; a partial failure retains the old cursor so the same window is retried.
implementation:
  - symbol: ctx_app.ingest.GitLabIngestRunner.run_scoped_with_refresh
tests:
  - symbol: ctx_app.ingest.tests.gitlab_ingest_advances_its_sync_cursor_and_passes_it_to_the_next_run
  - symbol: ctx_app.ingest.tests.a_failed_external_batch_persists_neither_artifacts_links_nor_cursor
