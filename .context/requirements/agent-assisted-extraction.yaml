id: REQ-AI-001
type: requirement
feature: FEAT-INDEXING
status: active
statement: >
  `ctx enrich --agent <claude|codex|antigravity> [--model <model>]
  [--allow-ungrounded-symbols]` must analyze one bounded artifact
  neighborhood (REQ-NEIGHBORHOOD-001) at a time through an interchangeable
  agent boundary (ADR-AGENT-001) and propose typed
  Feature/Requirement/Invariant/Decision
  candidates only when the agent's own output cites concrete, verbatim
  evidence from that neighborhood — never free-form reasoning (PR-AI-004).
  Every evidence entry's artifact id is always checked against the
  neighborhood the agent was actually given; a citation outside that bound
  is dropped, never trusted, regardless of any flag. Every
  implementation/test candidate path is checked against that same
  neighborhood too, by default: a path outside it is dropped, never trusted.
  `--allow-ungrounded-symbols` relaxes only this second check, letting an
  implementation/test candidate path survive even when it names no symbol
  or test this neighborhood actually surfaced — a deliberate, explicit
  escape hatch for artifacts (e.g. Jira issues) with no direct code links,
  where the strict check would otherwise leave hundreds of requirements
  with no implementation mapping at all. Evidence grounding itself is never
  relaxed by this or any flag: a candidate still needs real, verbatim,
  in-neighborhood evidence to be proposed at all, whichever way the flag is
  set. A candidate left with no valid evidence after dropping is dropped
  entirely. A `relevant` response that loses every candidate this way, or the agent's
  own `not_relevant`/`insufficient_evidence` answer, all resolve to "nothing
  proposed" rather than a fabricated substitute (PR-P02, FR-01) — absence of
  extracted knowledge is always the safe outcome. A single schema-valid JSON
  object may be wrapped in Markdown fences or explanatory prose and is still
  consumed without losing it; braces inside JSON strings are handled as data.
  Malformed, truncated, schema-incompatible, or ambiguous multi-object agent
  output is rejected with an explicit reason rather than guessed at or
  repaired. Every accepted
  candidate carries full provenance (producer, model, the exact input
  artifact ids, a timestamp, and a fingerprint of the prompt that produced
  it) — `--model`, when set, is threaded straight into that same provenance
  rather than affecting the prompt contract itself, since it names which
  model the already-selected CLI vendor uses, not a different vendor — and
  is persisted as `pending` (ctx_core.knowledge.KnowledgeCandidate),
  never auto-promoted to fact or assertion — a human decision through `ctx
  verify` (Phase 6) is the only path from `pending` onward. `ctx enrich`
  skips an artifact already cited as evidence by a pending candidate, and
  separately skips one whose content hasn't changed since its last analysis
  regardless of outcome (REQ-INCR-002 -- a `not_relevant` answer is recorded
  too, not only a proposed candidate) rather than re-analyzing it every run.
  It also skips a `Comment`/`ReviewComment`/`Commit`/`Branch` as its own
  analysis subject whenever a known parent artifact already structurally
  covers it (a comment's known `CommentsOn` issue/MR, a commit's known
  containing branch or MR via `ContainsCommit`, a branch's known merge/pull
  request via its `source_branch` `References` link) -- that artifact's text
  is already part of the parent's own neighborhood (`build_neighborhood`
  reads links in either direction), so a separate agent call on it is mostly
  redundant with the one already spent on its parent. Never skipped when no
  such parent is yet known (an orphaned comment/commit, or a branch with no
  merge request), since that is its only chance to be analyzed at all.
  Everything built before this phase
  (`ctx index`/`ctx impact`/`ctx review`/`ctx explain`/`ctx context`) keeps
  working unchanged with zero agents ever configured and zero candidates
  ever proposed (PR-AGENT-002). This contract -- prompt shape, JSON parsing,
  evidence/path validation -- lives once in ctx_adapters.agent_contract and
  applies identically to every vendor (ADR-AGENT-001): `--agent codex`
  (`codex exec`, OpenAI) and `--agent antigravity` (`agy -p`, Google) are the
  same guarantee through a different subprocess, not a second implementation
  of it. `ctx enrich` reports progress to stderr immediately before each
  real agent call (`[position/total] analyzing ...`, position/total against
  the full known-artifact count so it stays meaningful across skips) since
  a real agent round trip can take tens of seconds and, with dozens or
  hundreds of ingested artifacts, no output at all is indistinguishable
  from a hang — found from an actual user run, not a test.
implementation:
  - symbol: ctx_app.ports.SemanticAgent
  - symbol: ctx_app.enrich.EnrichRunner.run_with_progress
  - symbol: ctx_app.enrich.is_covered_by_a_known_parent
  - symbol: ctx_adapters.agent_contract.analyze
  - symbol: ctx_adapters.agent_contract.parse_json_response
  - symbol: ctx_adapters.agent_contract.to_outcome
  - symbol: ctx_adapters.claude_code.ClaudeCodeAgent.analyze_neighborhood
  - symbol: ctx_adapters.codex.CodexAgent.analyze_neighborhood
  - symbol: ctx_adapters.antigravity.AntigravityAgent.analyze_neighborhood
tests:
