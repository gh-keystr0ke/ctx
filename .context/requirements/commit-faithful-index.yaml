id: REQ-INDEX-001
type: requirement
feature: FEAT-INDEXING
status: active
statement: >
  Indexing must incrementally reconcile Git changes, configured source scope,
  and analyzer versions so the stored graph describes the selected commit —
  or as much of it as every file's analyzer could actually parse — stale
  derived analysis is rebuilt without requiring a source edit, database
  entities follow the complete current access set — including column-level
  write evidence and schema constraint/operation detail, not only table names
  — and symbol identity assignment stays scoped to the whole transition so two
  unrelated symbols across different files can never be silently assigned the
  same stable identity — including via the same-shape identity fallback,
  whose candidate pool is restricted to symbols belonging to a file this
  transition is actually modifying, renaming, or deleting, so a brand-new
  file can never steal an untouched file's still-live symbol identity merely
  by sharing its name, kind, and structural shape. A file whose analyzer
  fails is excluded from that transition rather than aborting reconciliation
  of the rest, and stays
  outside the stored snapshot so it is re-surfaced as needing analysis on
  every subsequent index until it succeeds or leaves scope (REQ-INDEX-002).
implementation:
  - symbol: ctx_app.index.IndexRunner.run
  - symbol: ctx_core.indexing.plan_incremental_index
  - symbol: ctx_core.indexing.reconcile_analysis_versions
tests:
  - symbol: crates.ctx-cli.tests.e2e.mixed_python_rust_and_go_repository_indexes_and_reviews_through_one_registry
  - symbol: ctx_core.indexing.tests.analyzer_version_change_reparses_an_unchanged_file_once
  - symbol: ctx_adapters.sqlite.index.tests.same_commit_reanalysis_replaces_derived_node_version
  - symbol: ctx_core.indexing.tests.same_named_same_shaped_symbols_in_different_files_claim_distinct_identities
  - symbol: ctx_core.indexing.tests.same_named_same_shaped_symbols_claim_distinct_identities_regardless_of_file_order
  - symbol: ctx_core.indexing.tests.a_new_files_same_shaped_symbol_does_not_steal_an_unrelated_unchanged_files_identity
  - symbol: ctx_core.indexing.tests.database_entities_and_facts_follow_the_current_symbol_snapshot

