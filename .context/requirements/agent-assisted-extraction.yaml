  - symbol: crates.ctx-cli.tests.e2e.enrich_drops_ungrounded_implementation_and_test_candidates_by_default
  - symbol: crates.ctx-cli.tests.e2e.enrich_allow_ungrounded_symbols_keeps_implementation_and_test_candidates_outside_the_neighborhood
