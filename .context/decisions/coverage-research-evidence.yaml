id: ADR-COVERAGE-003
type: decision
feature: FEAT-INDEXING
title: Validate coverage research against bounded evidence
status: accepted
decision: >
  Compile a deterministic evidence package and request one typed judgment per
  investigated gap through the configured agent. Check citations against the
  supplied package. An Established judgment may resolve a gap only if it cites
  a current, active assertion linked to the symbol and attributable to the
  specific behavior. Retain provenance for the source and the agent run.
  Present unresolved judgments through bounded developer questions. Save new
  developer explanations through the existing knowledge candidate workflow.
  Coverage reports may display suspected divergence with evidence from both
  sides. Agent failure leaves deterministic analysis available.
implementation:
  - symbol: ctx_adapters.agent_registry.ConfiguredAgent
  - symbol: ctx_core.coverage.research.ResearchInput.validate
  - symbol: ctx_cli.coverage_command.research.run
  - symbol: ctx_cli.coverage_command.ask.ask
tests:
  - symbol: crates.ctx-cli.tests.e2e.coverage_ask_preserves_dispositions_and_stages_anchored_knowledge
  - symbol: crates.ctx-cli.tests.e2e.coverage_research_uses_a_current_assertion_and_handles_agent_failure
  - symbol: ctx_core.coverage.research.tests.rejects_unverified_citations_and_downgrades_test_only_explanations
  - symbol: ctx_adapters.agent_registry.tests.records_failed_requests_without_prompt_contents
