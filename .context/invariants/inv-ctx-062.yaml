id: INV-CTX-062
type: invariant
status: active
statement: ID allocation must skip IDs found in on-disk .context YAML documents even when the indexed graph does not yet know about them, preventing allocation of an ID that duplicate-file verification would reject.
implementation:
  - symbol: ctx_core.verification.KnowledgeIdAllocator.mark_used
  - symbol: ctx_app.verification.KnowledgeVerificationService.auto_with_progress
tests:
  - symbol: ctx_app.verification.knowledge_tests.auto_skips_an_id_already_on_disk_even_when_the_graph_has_not_indexed_it_yet
