id: INV-PROVENANCE-001
type: invariant
feature: FEAT-IMPACT
status: active
statement: >
  Every semantic relationship surfaced to a user must retain its claim class,
  provenance, confidence, status, validity, producer, source location, and
  evidence so its rationale is reproducible rather than generated after fact;
  statically extracted database relationships — reads, writes, and declared
  schema alike — must expose the same source and locator trail as first-class
  FACT claims. When a query resolves to several distinct nodes, each keeps
  its own independent set of claims and evidence rather than having them
  pooled across matches (PR-LOOKUP-003; see REQ-LOOKUP-001). This extends to
  the full external-artifact -> agent-inference -> human-verification chain
  (prompt3.md §16/§19, Phase 9): a `ctx explain` result for a single-subject
  Feature/Requirement/Invariant/Decision that reached the graph through
  `ctx verify --knowledge --accept` additionally carries the input artifact
  ids the agent's neighborhood was built from, the agent's own producer/model
  (never fabricated when absent), and the accepting human's author/timestamp
  — assembled at the `ctx-app` layer from the still-intact accepted-candidate
  record (REQ-VERIFY-002 kept it, never discarded it, for exactly this). A
  hand-authored `.context/*.yaml` document has no candidate row, so it
  carries none of this rather than a guessed substitute — the same "explain
  only from what's actually stored" discipline this invariant already
  requires of every other claim. The chain also carries a structured
  `decision_method` (`human` or `agent`) alongside `decided_by`/`decided_at`,
  kept as its own typed field rather than folded into the free-text author
  string, so an agent's own independent second-opinion review
  (`ctx verify --knowledge --auto`, once it lands) can never render as though
  a human reviewed it: `ctx explain` prints "Verified by" for a human
  decision and "Auto-verified by ... (no human review)" for an agent one.
  `INV-EPISTEMIC-001` still holds either way — a human explicitly configured
  and triggered `--auto` — but the rendered provenance says so honestly
  rather than looking identical to a human review that never happened.
implementation:
  - symbol: ctx_adapters.sqlite.context.create_claim_if_missing
  - symbol: ctx_adapters.sqlite.context.persist_symbol_claim
  - symbol: ctx_core.explain.explain
  - symbol: ctx_core.explain.KnowledgeProvenance
  - symbol: ctx_core.knowledge.DecisionMethod
  - symbol: ctx_app.query.QueryService.explain
  - symbol: ctx_app.query.QueryService.knowledge_provenance_for
tests:
  - symbol: ctx_adapters.sqlite.context.tests.explicit_links_persist_an_explainable_evidence_chain
  - symbol: ctx_core.business.tests.invariant_links_are_enforcement_assertions
  - symbol: ctx_adapters.sqlite.index.tests.database_facts_persist_with_static_evidence_and_status_counts
  - symbol: ctx_app.query.tests.a_requirement_from_an_accepted_candidate_carries_its_full_provenance_chain
  - symbol: ctx_app.query.tests.a_hand_authored_requirement_carries_no_provenance_chain
  - symbol: ctx_app.query.tests.a_relationship_query_never_carries_a_provenance_chain
  - symbol: ctx_adapters.sqlite.artifacts.tests.accepted_record_reports_an_agent_decision_honestly
