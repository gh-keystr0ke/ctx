  - symbol: ctx_adapters.sqlite.verification.stale_claim_tests.reactivates_the_specific_stale_edge_and_records_an_audit_annotation
  - symbol: ctx_adapters.sqlite.verification.stale_claim_tests.reactivating_an_unknown_fingerprint_is_reported_honestly_rather_than_erroring
  - symbol: ctx_adapters.agent_contract.tests.review_stale_claims_accepts_when_the_agent_confirms_the_mapping_still_holds
  - symbol: ctx_adapters.agent_contract.tests.review_stale_claims_can_reject_a_mapping_that_no_longer_holds
  - symbol: ctx_adapters.agent_contract.tests.review_stale_claims_rejects_an_invented_fingerprint_not_trusted
  - symbol: ctx_adapters.agent_contract.tests.review_stale_claims_rejects_a_decision_list_missing_a_claim
  - symbol: ctx_adapters.agent_contract.tests.stale_claim_review_batches_without_dropping_claims
  - symbol: ctx_adapters.agent_contract.tests.one_claim_larger_than_the_prompt_budget_fails_explicitly
  - symbol: ctx_app.verification.stale_claim_tests.stale_claims_lists_every_stale_semantic_edge_from_the_graph
  - symbol: ctx_app.verification.stale_claim_tests.an_accepted_verdict_reactivates_the_claim_bindingly
  - symbol: ctx_app.verification.stale_claim_tests.a_rejected_verdict_is_only_a_suggestion_never_applied
  - symbol: ctx_app.verification.stale_claim_tests.an_accept_that_no_longer_applies_is_reported_honestly
  - symbol: ctx_app.verification.stale_claim_tests.reviewing_no_claims_never_calls_the_agent
  - symbol: ctx_app.status.tests.a_stale_edge_whose_node_was_retired_never_produces_an_empty_unactionable_notice
  - symbol: crates.ctx-cli.tests.e2e.verify_stale_reactivates_an_accepted_claim_and_leaves_a_rejected_one_as_a_suggestion_only
