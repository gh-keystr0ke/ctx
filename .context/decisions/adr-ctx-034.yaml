id: ADR-CTX-034
type: decision
status: active
title: The Codex agent uses `codex exec [--model M] <prompt>` without extra flags beyon…
decision: The Codex agent uses `codex exec [--model M] <prompt>` without extra flags beyond an optional `--model`, relying on `codex exec`'s own read-only-sandbox/never-approval defaults for read-only analysis. `--model` is appended only when `ctx enrich --model` is set; unset, the invocation stays exactly `codex exec <prompt>`.
implementation:
  - symbol: ctx_adapters.codex.SubprocessTransport.AgentTransport.run
tests:
  - symbol: ctx_adapters.codex.tests.subprocess_transport_invokes_codex_exec_and_returns_stdout

