[workspace]
members = [
    "crates/ctx-core",
    "crates/ctx-app",
    "crates/ctx-adapters",
    "crates/ctx-cli",
    "crates/ctx-mcp",
    "crates/ctx-eval",
]
resolver = "2"

[workspace.package]
version = "0.7.4"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "A local-first product-context engine that links product intent (Features, Requirements, Invariants, Decisions) to code, with provenance and confidence."
repository = "https://github.com/gh-keystr0ke/ctx"
readme = "README.md"

[workspace.dependencies]
base64 = "0.23"
blake3 = "1.8.2"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.45", features = ["derive"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
yaml_serde = "0.10.7"
tempfile = "3.20.0"
thiserror = "2.0.16"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
tree-sitter = "0.25.8"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
ureq = "3.4.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
