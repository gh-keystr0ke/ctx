id: ADR-CORE-001
type: decision
title: Keep domain decisions in a functional core
status: accepted
decision: >
  Git, filesystems, parsers, SQLite, CLI, and MCP remain imperative adapters and
  orchestrators; normalized database accesses enter through the same parser
  boundary, while their lifecycle planning, impact, review, verification, and
  Context Pack policy remain deterministic transformations in ctx-core.
implementation:
  - symbol: ctx_core.indexing.plan_incremental_index
tests:
  - symbol: ctx_core.indexing.tests.structurally_equal_symbols_added_together_do_not_impersonate_history
  - symbol: ctx_core.indexing.tests.same_named_same_shaped_symbols_in_different_files_claim_distinct_identities
  - symbol: ctx_core.indexing.tests.database_entities_and_facts_follow_the_current_symbol_snapshot
