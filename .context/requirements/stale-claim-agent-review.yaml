id: REQ-VERIFY-004
type: requirement
feature: FEAT-INDEXING
status: active
statement: >
  `ctx verify --stale --agent <claude|codex|antigravity> [--model <model>]` must let a review
  agent re-examine every currently stale semantic claim (an explicit `.context/*.yaml`
  `implementation`/`tests` mapping whose underlying code changed since it was last confirmed,
  ctx_core.verification.stale_semantic_claims) and decide whether it still holds, instead of the
  claim staying stale forever -- by design (docs/architecture.md: "semantic assertions are never
  silently recreated as facts"), re-indexing alone never heals a stale claim, and the user asked
  directly for an agent-driven way to re-check it rather than hand-editing `.context/*.yaml` files
  to force a refresh.

  The user explicitly scoped the two verdicts asymmetrically: an `accept` verdict is binding --
  ctx_app.ports.StaleClaimStore.reactivate_stale_claim reactivates precisely the one edge identified
  by its fingerprint (never the whole document that happens to declare it, which would also refresh
  every other claim that document declares, stale or not) and records an audit annotation. A
  `reject` verdict is never applied automatically -- ctx-cli only ever prints it as a suggestion
  (source, target, and the agent's reasoning) for a human to act on, since silently discarding a
  hand-authored mapping is a materially different risk than confirming one still holds.

  ctx_core.verification.StaleClaim carries what a review needs: the claim's own fingerprint,
  relation, source/target node summaries, evidence locators, and (always populated, already in
  memory on the graph) the product intent's full statement text. `symbol_excerpt` -- the current
  source of whichever side is a CodeSymbol -- is deliberately left `None` by
  ctx_core.verification.stale_semantic_claim_details (ctx-core never touches the filesystem) and
  filled in by ctx_cli.enrich_stale_claims_with_current_code reading the symbol's own indexed byte
  range from disk, which is safe even though the claim itself is stale: the symbol node was already
  re-indexed fresh at HEAD, so only the semantic edge asserting it still satisfies the product intent
  is what's marked stale, not the range describing where the symbol currently lives. The whole
  claim (code excerpt and product intent statement both inlined) is self-contained in the prompt
  ctx_adapters.agent_contract.review_stale_claims sends -- deliberately not relying on an agent
  reading files itself, since ctx_adapters.antigravity's own sandbox does not grant that (its
  existing SemanticAgent/KnowledgeReviewAgent prompts are fully self-contained for the same reason),
  and a self-contained prompt works identically across all three agents regardless of their own
  sandbox policy.

  ctx_app.ports.StaleClaimReviewAgent is a third deliberate sibling to SemanticAgent/
  KnowledgeReviewAgent (ADR-AGENT-001) -- reviewing already-established, previously-confirmed
  claims against current code is a different question from both "does this neighborhood state new
  knowledge" and "should this already-extracted candidate be accepted," with its own input (claims,
  not artifacts or candidates) and output (a verdict plus reasoning, keyed by fingerprint, never a
  position/index -- the same discipline ctx_core.knowledge.CandidateReviewDecision already follows).
  Every response is validated the same way `review()` already is: a decision naming an unknown or
  duplicate fingerprint, or a response that doesn't cover every input claim exactly once, is rejected
  outright rather than guessed at.

  A repository may have enough stale claims to exceed both a model context window and the operating
  system's command-line argument limit. `review_stale_claims` must therefore partition the complete
  claim list into independently validated batches bounded by both serialized prompt bytes and claim
  count. Every claim appears in exactly one batch; no claim is truncated or dropped. If one complete
  claim cannot fit the configured byte budget, the command fails with an explicit prompt-budget error
  before invoking an agent, rather than passing an unbounded argument or accepting partial JSON.

  `ctx status`'s own stale-relationship notice must name every currently stale claim as a runnable
  `ctx explain "source -> target"` query (REQ-STATUS-001) using the same
  stale_semantic_claims/stale_semantic_claim_details list `ctx verify --stale` reviews -- the two
  commands must never disagree about which claims are stale. Gating the NeedsAttention health state
  on stale_semantic_edges' raw row count while displaying the filtered stale_claims list was found to
  diverge live (a stale edge whose source or target node was later fully retired, not merely
  re-shaped, is filtered out of stale_claims but still counted in the raw total) -- classify_health
  must gate on the same filtered list diagnostics displays, never the raw count, so an orphaned,
  unactionable stale edge with no resolvable node on either side is never reported as an empty,
  unactionable notice.
implementation:
  - symbol: ctx_core.verification.StaleClaim
  - symbol: ctx_core.verification.stale_semantic_claim_details
  - symbol: ctx_core.verification.StaleClaimVerdict
  - symbol: ctx_app.ports.StaleClaimReviewAgent
  - symbol: ctx_app.ports.StaleClaimStore
  - symbol: ctx_app.verification.VerificationService.stale_claims
  - symbol: ctx_app.verification.VerificationService.review_stale_claims
  - symbol: ctx_app.verification.StaleClaimReviewReport
  - symbol: ctx_app.verification.StaleClaimOutcome
  - symbol: ctx_app.status.classify_health
  - symbol: ctx_adapters.sqlite.verification.SqliteStore.StaleClaimStore.reactivate_stale_claim
  - symbol: ctx_adapters.agent_contract.review_stale_claims
  - symbol: ctx_adapters.agent_contract.review_stale_claims_with_budget
  - symbol: ctx_adapters.claude_code.ClaudeCodeAgent
  - symbol: ctx_adapters.codex.CodexAgent
  - symbol: ctx_adapters.antigravity.AntigravityAgent
  - symbol: ctx_cli.verify_command.verify_stale
  - symbol: ctx_cli.verify_command.enrich_stale_claims_with_current_code
tests:
