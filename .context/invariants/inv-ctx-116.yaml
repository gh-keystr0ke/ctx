id: INV-CTX-116
type: invariant
status: active
statement: >
  In legacy all-artifacts enrichment, a Comment, ReviewComment, Commit, or
  Branch that structurally resolves to a known parent never consumes its own
  agent call because its text is already in the parent's neighborhood; an
  orphan still receives a legacy call. In business-linked enrichment the
  stronger rule applies: no Commit, Branch, MergeRequest, or comment is ever
  a standalone subject, orphaned or not; only a retained Jira issue can anchor
  the bundle containing that evidence.
implementation:
- symbol: ctx_app.enrich.is_covered_by_a_known_parent
- symbol: ctx_app.enrich.EnrichRunner.run_with_progress
- symbol: ctx_app.enrich.EnrichRunner.run_business_linked_with_progress
tests:
- symbol: ctx_app.enrich.tests.a_comment_with_a_known_parent_is_skipped_but_its_parent_is_still_analyzed
- symbol: ctx_app.enrich.tests.an_orphaned_comment_with_no_known_parent_is_still_analyzed
- symbol: ctx_app.enrich.tests.a_branch_named_by_a_known_merge_requests_source_branch_is_skipped
- symbol: ctx_app.enrich.tests.a_commit_contained_by_a_known_branch_or_merge_request_is_skipped
- symbol: ctx_app.enrich.tests.business_linked_enrich_rejects_git_and_merge_requests_without_jira
