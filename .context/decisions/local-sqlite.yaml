id: ADR-STORAGE-001
type: decision
feature: FEAT-INDEXING
title: Use local SQLite as the temporal source of truth
status: accepted
decision: >
  The MVP stores versioned claims, evidence, validity, annotations, and graph
  adjacency—including evidence for statically extracted database facts—in
  repository-local SQLite transactions; source analysis requires neither a
  network service nor an LLM, and no graph database is introduced without
  profiling evidence. External development artifacts (commits, branches,
  GitLab issues/MRs, code comments/docstrings) extend this same store as
  their own tables (`artifacts`, `artifact_links`,
  `artifact_analysis` for `ctx enrich`'s per-artifact incremental ledger,
  and `ingest_cursors` for `ctx ingest gitlab`'s per-provider sync cursor,
  REQ-INCR-001) rather than a second storage technology, matching this
  decision's original reasoning. The one exception is the pending
  AI-derived knowledge-candidate queue: it moved out of this database
  (dropping its former `knowledge_candidates` table) into git-tracked
  files under `.ctx-candidates/` (ADR-EXT-004), since this database is
  itself gitignored and per-checkout, and the pending queue specifically
  needs to survive across checkouts for a team to share it.
implementation:
  - symbol: ctx_adapters.sqlite.SqliteStore.open
  - symbol: ctx_adapters.sqlite.index.SqliteStore.IndexStore.apply_index
  - symbol: ctx_adapters.sqlite.graph.SqliteStore.GraphStore.load_graph
tests:
  - symbol: ctx_adapters.sqlite.tests.creates_and_reopens_a_repository_database
  - symbol: ctx_adapters.sqlite.tests.migration_closes_duplicate_current_edges_and_enforces_uniqueness
  - symbol: ctx_adapters.sqlite.index.tests.same_commit_reanalysis_replaces_derived_node_version
  - symbol: ctx_adapters.sqlite.index.tests.same_commit_reanalysis_replaces_derived_edge_and_evidence
  - symbol: ctx_adapters.sqlite.index.tests.database_facts_persist_with_static_evidence_and_status_counts
