id: INV-EPISTEMIC-001
type: invariant
feature: FEAT-IMPACT
status: active
statement: >
  A machine inference must never become a fact or assertion without an explicit
  human decision. Traversal state must remain path-specific so an inferred
  route cannot be mistaken for a verified route, one inference can never
  recursively amplify another inference, and a node reached only through the
  seed's own structural call graph (such as a shared test) must not inherit
  root rights to bridge into intent unrelated to the seed.
implementation:
  - symbol: ctx_core.context_pack.traversable
  - symbol: ctx_adapters.sqlite.verification.SqliteStore.VerificationStore.record_verification
tests:
  - symbol: ctx_core.context_pack.tests.never_chains_one_inference_through_another
  - symbol: ctx_core.verification.tests.candidate_score_exposes_individual_heuristic_signals
  - symbol: ctx_core.context_pack.tests.shared_test_reached_through_the_seeds_call_graph_does_not_bridge_unrelated_intent
