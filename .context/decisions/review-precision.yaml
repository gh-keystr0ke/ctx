id: ADR-PRECISION-001
type: decision
feature: FEAT-REVIEW
title: Prefer review precision over speculative coverage
status: accepted
decision: >
  Default review uses conservative confidence composition and may stay silent
  when evidence is weak; lower-confidence diagnostics belong behind verbose
  output because false positives destroy trust faster than missed weak links.
  This applies equally to a claim reached indirectly, one call hop away from
  a changed symbol, through a caller's own product claim: it composes
  confidence and evidence strength the same way a direct finding does, stays
  behind the same threshold, is deduplicated per affected caller/intent pair,
  and only ever originates from a genuinely callable changed symbol so a
  container's aggregate body-hash change can never fabricate a signal. Schema
  findings follow the same principle in a different shape: a schema change is
  always deterministic (never a confidence composition), but is reported as a
  separate schema_findings stream rather than folded into proven
  product-impact findings, so a destructive column drop can never be
  misread as an already-proven requirement violation.
implementation:
  - symbol: ctx_core.review.build_review_findings
  - symbol: ctx_core.review.schema_change_findings
tests:
  - symbol: ctx_core.schema.tests.declared_drop_and_rename_are_destructive

