id: REQ-AI-001
type: requirement
feature: FEAT-INDEXING
status: active
statement: >
  `ctx enrich --agent claude` must analyze one bounded artifact neighborhood
  (REQ-NEIGHBORHOOD-001) at a time through an interchangeable agent boundary
  (ADR-AGENT-001) and propose typed Feature/Requirement/Invariant/Decision
  candidates only when the agent's own output cites concrete, verbatim
  evidence from that neighborhood — never free-form reasoning (PR-AI-004).
  Every evidence entry's artifact id and every implementation/test candidate
  path is checked against the neighborhood the agent was actually given; a
  citation outside that bound is dropped, never trusted, and a candidate
  left with no valid evidence after dropping is dropped entirely. A
  `relevant` response that loses every candidate this way, or the agent's
  own `not_relevant`/`insufficient_evidence` answer, all resolve to "nothing
  proposed" rather than a fabricated substitute (PR-P02, FR-01) — absence of
  extracted knowledge is always the safe outcome. Malformed or unparseable
  agent output is rejected outright rather than guessed at. Every accepted
  candidate carries full provenance (producer, model, the exact input
  artifact ids, a timestamp, and a fingerprint of the prompt that produced
  it) and is persisted as `pending` (ctx_core.knowledge.KnowledgeCandidate),
  never auto-promoted to fact or assertion — a human decision through `ctx
  verify` (Phase 6) is the only path from `pending` onward. `ctx enrich`
  skips an artifact already cited as evidence by a pending candidate rather
  than re-analyzing it every run; everything built before this phase
  (`ctx index`/`ctx impact`/`ctx review`/`ctx explain`/`ctx context`) keeps
  working unchanged with zero agents ever configured and zero candidates
  ever proposed (PR-AGENT-002).
implementation:
  - symbol: ctx_app.ports.SemanticAgent
  - symbol: ctx_app.enrich.EnrichRunner.run
  - symbol: ctx_adapters.claude_code.ClaudeCodeAgent.analyze_neighborhood
  - symbol: ctx_adapters.claude_code.to_outcome
tests:
  - symbol: ctx_adapters.claude_code.tests.a_well_formed_relevant_response_becomes_a_grounded_candidate
  - symbol: ctx_adapters.claude_code.tests.an_evidence_id_outside_the_neighborhood_is_dropped_not_trusted
  - symbol: ctx_adapters.claude_code.tests.not_relevant_and_insufficient_evidence_pass_through_unchanged
  - symbol: ctx_adapters.claude_code.tests.malformed_output_is_rejected_not_guessed_at
  - symbol: ctx_adapters.claude_code.tests.subprocess_transport_invokes_claude_p_and_returns_stdout
  - symbol: ctx_app.enrich.tests.analyzes_every_artifact_and_persists_only_relevant_candidates
  - symbol: ctx_app.enrich.tests.an_artifact_already_cited_by_a_pending_candidate_is_skipped
  - symbol: ctx_app.enrich.tests.not_relevant_outcomes_never_reach_the_candidate_store
  - symbol: crates.ctx-cli.tests.e2e.enrich_shells_out_to_the_configured_agent_and_reports_its_outcome
  - symbol: crates.ctx-cli.tests.e2e.enrich_rejects_an_unsupported_agent
