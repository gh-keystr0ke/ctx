id: REQ-STATUS-001
type: requirement
feature: FEAT-INDEXING
status: active
statement: >
  Status must distinguish index freshness from knowledge health, expose the
  effective source scope and dirty inputs, and recommend an action instead of
  presenting a large structural graph as ready product context. The
  needs-mappings health state is a per-entity check (PR-MAP-003), not a
  repository-wide "are there any active assertions at all" count: it lists
  every active Requirement/Invariant/Decision with no active
  Implements/Enforces/Satisfies edge pointing to it, by identifier, so one
  freshly accepted `ctx verify --knowledge` document with no mapping is
  caught even while most other documents already have one — a coarser
  aggregate count would hide exactly that case. Feature is deliberately
  excluded from this check: every Feature document in this repository's own
  `.context/` and its fixtures is a pure descriptive umbrella with no
  `implementation`/`tests` of its own (the Requirements beneath it carry the
  real mapping), so flagging an unmapped Feature would be a false positive
  on the established convention, not a real gap. A Requirement/Invariant/
  Decision can opt out the same way per-document, by setting
  `implementation_expected: false` (ADR-CTX-049) — used only for a document
  that will never gain a code mapping by design, such as a scope-estimate
  spike ADR, never as a way to silence a real gap. A best-effort
  SQLAlchemy/goose reconciliation reports a column the ORM expects with no
  migration declaring it, or a migration-declared column with no ORM field,
  only for entities declared by both sources — an entity known from only one
  source has nothing to reconcile, and this system never fuzzy-matches schema
  identity. Any divergence folds into the existing needs-attention health
  state rather than becoming a separate vanity counter. The needs-attention
  notice for stale semantic relationships names every one of them as an exact
  `"source -> target"` string ctx explain accepts directly as a relationship
  query, the same way the needs-mappings notice already names every unmapped
  document by identifier -- a bare count with no identifiers left `ctx
  explain` (which requires a target) with nothing to point at, found by a
  real user running `ctx sync` immediately after `ctx status` reported
  stale relationships.
implementation:
  - symbol: ctx_app.status.StatusService.inspect
  - symbol: ctx_app.status.build_report
  - symbol: ctx_app.status.classify_health
  - symbol: ctx_app.status.diagnostics
  - symbol: ctx_core.verification.intents_without_mapping
  - symbol: ctx_core.verification.stale_semantic_claims
  - symbol: ctx_core.schema.reconcile_orm_and_migrations
tests:
  - symbol: ctx_app.status.tests.structural_only_graph_does_not_report_ready
  - symbol: ctx_app.status.tests.strong_current_assertions_make_the_graph_ready
  - symbol: ctx_app.status.tests.an_unmapped_document_forces_needs_mappings_even_when_others_are_well_mapped
  - symbol: ctx_app.status.tests.schema_divergences_prevent_a_ready_report_even_with_strong_assertions
  - symbol: ctx_app.status.tests.a_stale_relationship_notice_names_a_runnable_ctx_explain_query
  - symbol: ctx_core.verification.tests.intents_without_mapping_finds_only_the_unmapped_one
  - symbol: ctx_core.verification.tests.an_unmapped_feature_is_never_flagged
  - symbol: ctx_core.verification.tests.an_unmapped_spike_decision_is_never_flagged_but_an_ordinary_one_still_is
  - symbol: ctx_core.verification.tests.stale_semantic_claims_names_only_the_stale_relationship_as_a_runnable_explain_query
  - symbol: ctx_core.schema.tests.reconciliation_replays_migrations_in_file_path_order
  - symbol: ctx_core.schema.tests.reconciliation_ignores_entities_known_from_only_one_source

