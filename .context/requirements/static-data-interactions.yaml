id: REQ-DATA-001
type: requirement
feature: FEAT-INDEXING
status: active
statement: >
  Python, Rust, and Go analyzers must turn only statically visible SQL inside
  known execution calls into language-neutral database reads and writes. Each
  discovered entity and relationship must be deterministic, commit-bounded,
  evidence-backed, retired when no current symbol uses it, and available to
  impact, review, Context Pack, and semantic-candidate scoring; dynamic or
  unsupported SQL must remain unknown rather than becoming a guessed fact.
implementation:
  - symbol: ctx_adapters.database.sql_entities
  - symbol: ctx_core.indexing.add_database_access_edges
tests:
  - symbol: ctx_adapters.python.tests.extracts_static_sql_reads_and_writes_only_from_execution_calls
  - symbol: ctx_adapters.rust.tests.extracts_sqlx_and_rusqlite_static_database_accesses
  - symbol: ctx_adapters.go.tests.extracts_database_sql_static_accesses_from_interpreted_and_raw_strings
  - symbol: ctx_core.indexing.tests.database_entities_and_facts_follow_the_current_symbol_snapshot
  - symbol: ctx_adapters.sqlite.index.tests.database_facts_persist_with_static_evidence_and_status_counts
