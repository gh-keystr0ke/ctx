id: REQ-REVIEW-001
type: requirement
feature: FEAT-REVIEW
status: active
statement: >
  Default review output must suppress formatting, rename, and likely-refactor
  noise and emit only strong behavior or contract findings with affected
  intent, evidence, related tests, uncertainty, and a concrete reviewer
  action; a changed static database read or write target must be reported as
  a concrete behavior signal without being called a proven requirement
  violation. Schema changes from a migration or an edited SQLAlchemy model
  are surfaced as a separate schema_findings stream, classified destructive
  or informational from deterministic operations alone, and kept structurally
  apart from proven product-impact findings; each carries a bounded advisory
  link (one hop from the affected table, one hop from that code's own mapped
  intent) to the requirements/invariants/tests its readers/writers implement,
  never a fuller traversal that could bridge a popular table into unrelated
  product areas. An empty advisory link means no known mapping was found, not
  that the change is unrelated.
implementation:
  - symbol: ctx_core.review.build_review_findings
  - symbol: ctx_core.review.classify_behavior_change
  - symbol: ctx_core.review.schema_change_findings
  - symbol: ctx_core.review.db_entity_neighborhood
  - symbol: ctx_core.schema.declared_schema_changes
  - symbol: ctx_core.schema.diff_schema_tables
  - symbol: ctx_app.review.ReviewRunner.run
tests:
  - symbol: ctx_core.review.tests.behavior_change_with_documented_requirement_creates_one_precise_finding
  - symbol: ctx_core.review.tests.classifies_contract_and_formatting_changes_without_guessing_equivalence
  - symbol: crates.ctx-cli.tests.e2e.complete_product_journey_is_deterministic_and_evidence_backed
  - symbol: ctx_core.review.tests.reports_changed_database_reads_and_writes_as_behavior_signals
  - symbol: ctx_core.schema.tests.diff_does_not_guess_a_rename_from_name_similarity
  - symbol: ctx_core.schema.tests.adding_a_not_null_column_without_default_to_an_existing_table_is_destructive
