id: INV-CTX-018
type: invariant
status: active
statement: After a real behavior change is committed and indexed, invalidated human-verified assertions must be marked stale, and `ctx impact` must expose that staleness as uncertainty rather than retaining, removing, or hiding it.
implementation:
  - symbol: ctx_adapters.sqlite.index.mark_semantic_edges_stale
  - symbol: ctx_core.impact.ImpactUncertainty
  - symbol: ctx_core.impact.uncertainty
tests:
  - symbol: ctx_core.indexing.tests.changed_body_versions_symbol_and_marks_semantics_stale
  - symbol: ctx_core.impact.tests.follows_only_the_product_chain_and_surfaces_staleness
