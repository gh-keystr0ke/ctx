id: ADR-CTX-045
type: decision
status: active
title: CLI agents share a common transport-agnostic analysis contract, while each vendo…
decision: >
  CLI agents share a common transport-agnostic analysis contract, while each
  vendor adapter owns its vendor-specific argument construction and delegates
  analysis to the shared module. The shared subprocess boundary retries only
  transient executable-busy spawn errors, for at most three attempts; every
  other spawn error is surfaced immediately. This keeps the OS-level startup
  behavior consistent without moving vendor-specific invocation policy out of
  the adapters.
implementation:
  - symbol: ctx_adapters.agent_contract.analyze
  - symbol: ctx_adapters.agent_contract.AgentTransport
  - symbol: ctx_adapters.agent_contract.run_subprocess
  - symbol: ctx_adapters.claude_code.ClaudeCodeAgent.analyze_neighborhood
  - symbol: ctx_adapters.codex.CodexAgent.analyze_neighborhood
  - symbol: ctx_adapters.antigravity.AntigravityAgent.analyze_neighborhood
tests:
  - symbol: ctx_adapters.agent_contract.tests.executable_busy_spawn_errors_are_retried_with_a_finite_budget
  - symbol: ctx_adapters.agent_contract.tests.non_transient_spawn_errors_are_not_retried
  - symbol: ctx_adapters.claude_code.tests.subprocess_transport_invokes_claude_p_safe_mode_and_returns_stdout
  - symbol: ctx_adapters.codex.tests.subprocess_transport_invokes_codex_exec_and_returns_stdout
  - symbol: ctx_adapters.antigravity.tests.subprocess_transport_invokes_agy_p_and_returns_stdout
