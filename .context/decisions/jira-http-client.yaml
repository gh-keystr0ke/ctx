id: ADR-EXT-005
type: decision
feature: FEAT-INDEXING
title: Scope Jira ingestion to referenced-plus-one-hop issues, keyed by their human-readable key, on the GitLab client's ureq/transport-trait shape
status: accepted
decision: >
  Jira ingestion (`ctx ingest jira`) reuses ADR-EXT-003's architecture: a
  synchronous `ureq` client behind an injectable `JiraTransport` trait, so
  `JiraClient`'s own tests run against canned fixture responses, never a
  live Jira instance or a real socket — the same reasoning applies
  unchanged (every other part of `ctx` is synchronous; there is no
  throughput case for an async runtime in a CLI tool making a handful of
  sequential requests per run).

  Unlike GitLab, where one project maps to one repository, a single Jira
  project routinely spans many unrelated services/repositories. Mirroring
  GitLab's "fetch everything for the configured project" would mean every
  such repository pulls the same mostly-irrelevant backlog. Instead,
  `JiraClient::fetch_issue_artifacts_for_keys` takes a caller-supplied set
  of candidate issue keys (`JiraIngestRunner` builds this by scanning every
  artifact this repository already knows about -- commits, branches,
  GitLab issues/MRs, prior Jira issues -- for ticket-key-shaped references
  via the same `ReferenceKind::TicketKey` scanner the deterministic linker
  already uses), keeps only the ones under its own configured project, and
  fetches exactly those. This is also the identity decision specific to
  Jira: an issue artifact's `external_id` is Jira's human-readable issue
  key (`"PSI-1122"`), never its internal numeric id, which is what lets a
  ticket key already recognized by the linker double as the fetch-scoping
  key with no second parsing pass.

  The opt-in business-linked runner narrows candidate sources further to
  current Git and repository-linked merge requests plus their comments. It
  explicitly excludes prior Jira artifacts and unrelated GitLab issues, so
  tracker data cannot seed itself. Its related-issue depth is caller-bounded
  and defaults to zero; the legacy default mode retains the historical
  referenced-plus-one-hop behavior.

  On top of the referenced set, one hop of expansion: Jira's own
  `issuelinks` (blocks/relates-to/duplicates, either direction) and
  `parent` (subtask, or team-managed-project epic) fields name issues
  provider-reported as directly related, recorded as a `RelatedIssue`
  link (a structural fact, like `ContainsCommit`, never a text-derived
  guess). Expansion stops at one hop deliberately -- following a related
  issue's own further links could transitively drag in an unbounded slice
  of the project again, recreating the exact problem this scoping exists
  to avoid. Classic (company-managed) project epic links, which live
  behind an instance-specific custom field rather than `parent`, are not
  covered; that would require per-instance configuration this
  implementation deliberately doesn't ask for in v1.

  Because the candidate set is already bounded by what a repository's own
  artifacts actually mention, there is no sync cursor: every `ctx ingest
  jira` run simply re-fetches the current candidate-plus-one-hop set in
  full. This trades a cursor's efficiency for simplicity and freshness --
  re-ingesting an unchanged issue is a no-op upsert, so the only cost is a
  handful of extra requests, and it sidesteps a real correctness risk a
  cursor would have introduced here: Jira's JQL date literals carry no
  timezone marker and are evaluated in the instance's own configured
  timezone, so a naively time-filtered incremental query could silently
  miss updates near the boundary. Not having a time filter at all removes
  that risk entirely rather than working around it with a margin.

  Jira Cloud's `description`/comment `body` fields are Atlassian Document
  Format JSON, not plain text -- `flatten_adf` walks the ADF tree and
  concatenates its text nodes, since passing the raw JSON through as
  artifact `body` would make it both unreadable and useless as `ctx
  enrich` evidence.

  Scope for this implementation is deliberately Jira Cloud only (Basic
  auth via account email + API token, REST API v3) and issues + comments
  only. Jira Server/Data Center (different auth and API version),
  changelog/worklog/attachments ingestion are out of scope. HTTP 429 and
  transient 502/503/504 responses use the shared bounded retry policy:
  numeric `Retry-After` takes precedence over capped exponential backoff,
  and exhausting the finite budget fails explicitly. Comment pages are
  read until the provider-reported total is reached. Issue search uses
  `POST /rest/api/3/search/jql` (the enhanced JQL search endpoint), not the
  legacy `GET /rest/api/3/search` -- Atlassian has sunset the latter (it
  now answers HTTP 410 Gone), and the replacement also drops
  `startAt`/`total` offset pagination for an opaque `nextPageToken`
  cursor: search pages are read until a response carries no
  `nextPageToken`. `JiraTransport` therefore exposes both `get` (comments)
  and `post` (search), unlike GitLab's transport trait, which never needs
  more than `get`. `fetch_issues_by_keys` also caps pagination at
  `MAX_SEARCH_PAGES` (1000): Atlassian Community has reported this
  endpoint occasionally reissuing a fresh `nextPageToken` without ever
  terminating, and the endpoint's own `isLast` response flag has been
  reported stuck the same way, so neither is a safe sole stop condition
  -- exceeding the cap is a reported `JiraError::Transport`, not a hang.
  In practice this is a backstop, not a path expected to trigger: each
  `key in (...)` query is already bounded to `KEY_BATCH_SIZE` (50) keys,
  well under the endpoint's `maxResults` (100), so a well-behaved response
  always fits on one page.
