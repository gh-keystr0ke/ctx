id: REQ-EXT-001
type: requirement
feature: FEAT-INDEXING
status: active
statement: >
  ctx must be able to import external development artifacts as normalized,
  separately stored source material (prompt3.md PR-EXT-001 MUST list),
  without requiring any AI agent or network provider account. Git-native
  ingestion (`ctx ingest git`) reads every local branch name and every
  commit reachable from HEAD (optionally bounded to commits after a given
  OID) as artifacts, each keyed by its own identity for idempotent re-sync —
  running ingestion again never duplicates an already-known commit or
  branch, only versions it if its stored content actually changed. Each
  branch other than the repository's own default branch is additionally
  linked (`ContainsCommit`) to the commits it alone contains relative to
  that default branch (resolved from `.ctx/config.toml`'s `[git]
  default_branch`, `origin/HEAD`, or a `main`/`master` fallback, in that
  order; no default branch resolving means no branch-commit links at all,
  never a guess), bounded to the newest 100 commits per branch — surviving
  the individual commit messages a squash-merge would otherwise discard.
  Each commit is additionally linked (`ChangedSymbol`) to every currently
  indexed code symbol in the files that commit itself changed, read from the
  same `git log --name-status` pass that produced the commit artifact rather
  than a per-commit subprocess; a changeset wider than 10% of the
  repository's currently indexed files (floored at 20 for small
  repositories) attributes no symbols at all rather than an arbitrary
  subset. After ingesting, every artifact's title/body text is scanned for deterministic
  references (ctx_core.linking) to every other artifact already known for
  the repository, and a References link is persisted for each one that
  resolves to a real, already-known target — never a guessed one.
  Ingestion registers its own repository row and does not require `ctx
  index` to have run first, since prompt3.md's own acceptance scenario
  starts from a project with no prior `.context`. Code-comment/docstring
  ingestion (`ctx ingest code-comments`) reads every currently indexable
  source file's text and extracts comment/docstring candidates, each
  attributed to its nearest enclosing code entity rather than only the
  containing file, and linked (`Discusses`) to that entity's already-indexed
  graph symbol only when the candidate's canonical path resolves to exactly
  one symbol — an ambiguous canonical path (a cross-language collision)
  stays unlinked rather than guessed at, the same discipline persistent
  `.context/*.yaml` mappings already use. GitLab issue/merge-request
  ingestion (`ctx ingest gitlab`, the chosen end-to-end PR-EXT-001 MUST
  provider) extends this same document rather than a new one, since the
  "normalized artifact, idempotent re-sync, deterministic-only linking"
  guarantee applies identically to every source: it fetches every issue and
  merge request for the configured project, their non-system comments, and
  each merge request's commit SHAs, normalizing all of it into artifacts
  plus the deterministic links GitLab's own API reports directly (a comment
  `CommentsOn` its issue/MR, an MR `ContainsCommit` for each of its commits,
  an MR `References` its own `source_branch` field as a Git branch identity
  — a structured-field fact, not a text mention, so it holds even when the
  branch name carries no ticket key) — on top of which the same text-reference scan every other source uses
  still runs, so a ticket mentioned in an MR body can resolve against an
  artifact from any already-known source, not only GitLab's own. GitLab
  ingestion is incremental by default (REQ-INCR-001): a stored sync cursor
  narrows the fetch to what changed since the previous run, but this is an
  optimization layered on top of the idempotent upsert this document
  requires, not a substitute for it — a missing, reset, or wrong cursor
  still degrades to "fetches more than strictly necessary," never to a
  duplicated or stale artifact. Jira Cloud issue ingestion (`ctx ingest
  jira`, ADR-EXT-005) extends this same document but deliberately does not
  mirror GitLab's "fetch everything for the configured project": a Jira
  project routinely spans many unrelated repositories, so fetching the
  whole project into each one would be mostly noise. Instead it scans every
  artifact this repository already knows about for ticket-key-shaped
  references, fetches only the ones under its own configured project, plus
  one hop of whatever Jira's own `issuelinks`/`parent` fields report as
  directly related to one of those (never recursing further), and
  normalizes both into artifacts plus the deterministic `CommentsOn` link
  between a comment and its issue and `RelatedIssue` link between two
  issues — on top of which the same text-reference scan still runs. It
  keys an issue artifact's identity by its human-readable key (e.g.
  `PSI-1122`), not Jira's internal numeric id, so a ticket key already
  recognized by `ctx_core.linking`'s deterministic scanner is also how this
  requirement decides which issues are even candidates to fetch. Jira
  Server/Data Center, changelog/worklog/attachments, classic-project
  custom-field epic links are explicitly out of scope for this requirement's
  current implementation. Every GitLab list (issues, merge requests, notes,
  and MR commits) and both Jira lists (search results and comments) must be
  fully paginated. Both HTTP transports must honor both standard forms of
  `Retry-After` (delay-seconds and HTTP-date) on 429 responses and apply a
  finite retry budget to rate limits and transient
  gateway/service failures; exhausting that budget is an explicit error.
