id: ADR-LANGUAGE-001
type: decision
feature: FEAT-INDEXING
title: Compile language modules behind one normalized registry
status: accepted
decision: >
  Language analyzers are self-describing compile-time modules selected by one
  registry and emit a shared IR. Go joined Python and Rust this way, proving the
  seam; new TypeScript, Java, or Zig support should add a parser module and
  registration the same way, without branching core or application use cases.
  Dynamic shared-library loading is deferred until a real need exists.
implementation:
  - symbol: ctx_adapters.analyzer.AnalyzerRegistry.register
tests:
  - symbol: crates.ctx-cli.tests.e2e.mixed_python_rust_and_go_repository_indexes_and_reviews_through_one_registry
