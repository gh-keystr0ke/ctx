id: ADR-EXT-002
type: decision
title: AI-derived knowledge candidates persist as their own pending queue
status: accepted
decision: >
  A typed Feature/Requirement/Invariant/Decision candidate an AI agent
  extracts from a bounded artifact neighborhood is stored in its own
  knowledge_candidates table, distinct from the existing heuristic
  ctx_core.verification.SemanticCandidate pipeline. The heuristic pipeline is
  cheap enough to recompute from the current graph on every ctx verify run;
  an agent call is not, so its output — statement, evidence (as concrete
  artifact excerpts, never free-form reasoning), candidate implementation/test
  anchors, and full agent provenance (producer, model, input artifact
  identities, timestamp, a fingerprint of the exact prompt/configuration) —
  must survive between runs. Candidates are upserted keyed by a deterministic
  fingerprint of (kind, statement) and start life as pending; an
  already-accepted or already-rejected candidate is left untouched by a later
  re-analysis proposing the same statement rather than being reverted to
  pending, so repeated ingestion of the same underlying evidence does not
  reopen a decision a human already made. A candidate is never itself a
  ctx_core.domain.Edge or a ctx_core.business.BusinessDocument — that
  promotion happens only through the human-verification step this table
  exists to feed (ctx verify --knowledge, REQ-VERIFY-002): record_decision
  updates a candidate's row keyed by WHERE status = 'pending', so a decision
  can only ever be recorded once — deciding an unknown or already-decided
  fingerprint fails clearly rather than reverting it, the enforcement this
  document's original "left untouched" guarantee anticipated before it had
  a decision-recording method to actually enforce it. An accepted
  candidate's evidence stays queryable afterward too (accepted_evidence,
  keyed by the resulting document's ID): REQ-MAP-001's heuristic scoring
  reuse reads it to check whether the same artifact also touched a
  candidate symbol, without ever needing a second AI call or a parallel
  evidence store of its own. The same accepted row -- its full
  AgentProvenance plus the human decided_by/decided_at -- is what `ctx
  explain` (accepted_record_for_document, Phase 9, INV-PROVENANCE-001)
  reads to render the complete artifact-to-inference-to-verification chain;
  the row's persistence past acceptance is what makes that chain
  reconstructable at all, not just accepted_evidence's narrower reuse. The
  recorded decision also carries a DecisionMethod (human or agent), so a
  future agent-driven decision (`ctx verify --knowledge --auto`) is
  distinguishable from a human one at read time rather than only at
  decide time -- the same accepted row `ctx explain` reads is what makes
  that distinction renderable, not a separate parallel record.
implementation:
  - symbol: ctx_core.knowledge.KnowledgeCandidate
  - symbol: ctx_core.knowledge.AgentProvenance
  - symbol: ctx_core.knowledge.DecisionMethod
  - symbol: ctx_app.ports.KnowledgeCandidateStore
  - symbol: ctx_adapters.sqlite.artifacts.SqliteStore.KnowledgeCandidateStore.upsert_candidates
  - symbol: ctx_adapters.sqlite.artifacts.SqliteStore.KnowledgeCandidateStore.pending_candidates
  - symbol: ctx_adapters.sqlite.artifacts.SqliteStore.KnowledgeCandidateStore.record_decision
  - symbol: ctx_adapters.sqlite.artifacts.SqliteStore.KnowledgeCandidateStore.accepted_evidence
  - symbol: ctx_adapters.sqlite.artifacts.SqliteStore.KnowledgeCandidateStore.accepted_record_for_document
tests:
  - symbol: ctx_adapters.sqlite.artifacts.tests.pending_candidates_round_trip_and_stay_out_once_decided
  - symbol: ctx_adapters.sqlite.artifacts.tests.accepting_a_candidate_removes_it_from_pending_and_records_the_resulting_document
  - symbol: ctx_adapters.sqlite.artifacts.tests.accepted_record_reports_an_agent_decision_honestly
  - symbol: ctx_app.query.tests.a_requirement_from_an_accepted_candidate_carries_its_full_provenance_chain
