id: REQ-EXT-002
type: requirement
feature: FEAT-INDEXING
status: active
statement: >
  The opt-in business-linked artifact scope must retain only development
  evidence with a deterministic path from this repository's Git artifacts
  to a Jira business-context issue, directly or through a repository-linked
  merge request. Jira project membership is only an admissibility check and
  is never repository-relevance evidence: Jira artifacts already stored in
  the repository cannot seed or perpetuate the scoped set. Merge requests
  without a Jira anchor, and branches or commits without a direct Jira
  anchor or an anchored merge-request relationship, are outside the final
  business scope. Jira RelatedIssue expansion is explicitly bounded and
  defaults to zero hops. Every keep/prune decision carries a deterministic
  reason suitable for logs and dry-run reports, and planning is linear in
  the number of artifacts and links. `ctx ingest gitlab --scope
  business-linked` lists merge-request summaries but fetches comments and
  commits only for MRs selected by a literal !IID in Git, a matching source
  branch, or a matching head/merge/squash commit SHA; GitLab issues are not
  fetched in this mode. `ctx ingest jira --scope business-linked` derives
  keys only from current Git plus those repository-linked MRs and their
  comments, never from old Jira artifacts or unrelated GitLab issues, and
  `--related-depth` controls the bounded Jira expansion. `ctx ingest
  code-comments --reconcile` treats HEAD as a complete snapshot and removes
  comments/docstrings no longer present only after the new snapshot was read
  successfully. `ctx enrich --scope business-linked` then creates exactly one
  bounded agent input per retained Jira issue: the Jira issue is the subject,
  while its deterministically connected selected MR, comments, branch,
  commits, changed symbols, and nearby tests are supporting evidence inside
  that same bundle. A branch, commit, or MR without a Jira business anchor is
  never submitted alone, even when it is orphaned. Linked artifact bodies are
  included so the bundle carries business and implementation context rather
  than only names or one commit-message. The legacy all-artifacts ingest and
  enrich behavior remains the default. `ctx artifacts prune --scope
  business-linked` exposes the complete reasoned plan as a dry run by default;
  only `--apply` atomically deletes the planned artifact set and its local
  dependencies. Prune never edits business documents or candidate files and
  reports pending candidates that cite removed evidence.
