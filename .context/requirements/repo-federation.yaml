id: REQ-FEDERATION-003
type: requirement
visibility: public
status: active
statement: >-
  A repository with an explicit service identity must be able to register neighboring local Git
  checkouts, export only public product documents plus every indexed HTTP endpoint as a
  deterministic commit-labelled manifest, explicitly synchronize compatible neighbor manifests
  without blocking healthy neighbors when one fails, keep imported knowledge provenance separate
  from local facts, resolve local outbound calls by HTTP method and normalized path template as
  FEDERATED_MATCH records carrying both commits, report every unresolved call honestly, and show
  whether synchronized neighbor data has become stale.
implementation:
  - symbol: ctx_adapters.federation.NeighborRegistry
  - symbol: ctx_adapters.federation.ExportManifest
  - symbol: ctx_adapters.federation.matching_resolutions
  - symbol: ctx_adapters.sqlite.federation.SqliteStore.replace_federated_repository
  - symbol: ctx_cli.sync
  - symbol: ctx_cli.federation_show
tests:
  - symbol: ctx_adapters.federation.tests.manifests_are_sorted_and_end_with_one_newline
  - symbol: ctx_adapters.sqlite.federation.tests.federated_snapshots_round_trip_without_entering_local_graph_tables
  - symbol: crates.ctx-cli.tests.e2e.repositories_export_sync_resolve_and_report_federated_contracts
  - symbol: crates.ctx-cli.tests.e2e.export_requires_an_explicit_service_identity
